<!DOCTYPE html>
<!-- photo gallery page -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lesotho Photo Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- navigation bar -->
    <header>
      <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
          <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
            <img class="brand-logo" src="Imgs/Coat_of_arms_of_Lesotho.jpg" alt="Coat of arms of Lesotho">
            <span>Visit Lesotho</span>
          </a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#myNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="myNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
              <li class="nav-item"><a class="nav-link" href="accommodation.html">Stays</a></li>
              <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Plan a trip</a></li>
            </ul>

            <button id="themeToggle" class="theme-toggle ms-lg-3" type="button">🌙</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- banner -->
      <section class="page-hero">
        <div class="container">
          <span>Scenes from the kingdom</span>
          <h1>The view from here</h1>
        </div>
      </section>

      <!-- my photos -->
      <section class="section">
        <div class="container">
          <div class="gallery-grid">
            <img class="gallery-item" src="Imgs/Maletsunyane_falls.jpeg" alt="Cloudy mountain peak">
            <img class="gallery-item" src="Imgs/Katse damn.jpeg" alt="Golden mountain valley">
            <img class="gallery-item" src="Imgs/Tsehlanyane.jpg" alt="Tsehlanyane National Park">
            <img class="gallery-item" src="Imgs/Qacha's_Nek01.jpg" alt="Qacha's Nek">
            <img class="gallery-item" src="Imgs/Maseru Market.jpg" alt="Maseru Market">
          </div>
        </div>
      </section>
    </main>

    <!-- footer -->
    <footer>
      <div class="container">
        <h3>Visit Lesotho</h3>
        <p>Travel slowly. Tread lightly. Leave with stories.</p>
        <div class="footer-bottom">© 2026 Visit Lesotho</div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
